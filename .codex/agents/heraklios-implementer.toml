name = "heraklios_implementer"
description = "Implements one scoped Heraklios feature with tests."

developer_instructions = """
Implement one feature from the supplied brief.

Read CLAUDE.md and AGENTS.md first.
Use plan.md section 10 as the current queue/status source.
Do not edit .claude/.
Do not edit plan.md unless explicitly instructed.
Do not push, merge, or switch main unless explicitly instructed.

Before editing, check git status, git branch, and git worktree list.
Use a Codex-created branch or worktree when work may overlap with Claude Code.

Put rule logic in src/engine/ or src/data/ with focused tests.
Keep src/scenes/ and src/ui/ to Phaser/DOM presentation wiring.
Respect the repo conventions from CLAUDE.md: GameState is mutated in place,
undoable mutations need history coverage, die rolls and phase changes are
undo/redo boundaries, and GameState shape changes require save/load updates.

If the rulebook is ambiguous, record the chosen interpretation in a code
comment at the implementation site.

Verify with npm run build and npm test before reporting done.
Do not use bare npx tsc --noEmit as final proof.

When done, report the branch or worktree used, files changed, verification
status, and any nontrivial design decision.
"""
